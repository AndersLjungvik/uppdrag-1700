function switchRegion(id,arrival=null){cancelPersonArrival();hoverPersonId=null;window.UPPDRAG_LIVING_DIALOGUES?.close(false);pendingRoom=null;region=REGIONS[id];path=[];sailing=null;pending=null;returnPending=false;const startId=arrival||region.start;player={...navigationPoint(region,startId)};camera={...player};follow=true;document.querySelector('#return').hidden=id==='main';document.querySelector('#sailM').hidden=true;document.querySelector('#sailS').hidden=true;document.querySelectorAll('[data-go]').forEach(b=>b.hidden=id!=='main');layers.delete(id);setMessage(region.name,id==='main'?'Fartyget har lagt till vid kajen. Du går i land där du reste ifrån.':'Du har kommit fram. Alla byggnader har en ansluten ingång.');syncHarbourUI();requestHarbour();}
function sail(id){if(interior||sailing||region!==MAIN)return;pendingRoom=null;pending=id;if(Math.hypot(player.x-navigationPoint(MAIN,'quay').x,player.y-navigationPoint(MAIN,'quay').y)<55){sailing={to:id,at:performance.now()};path=[];return}if(go('quay','Till kajen'))setMessage('Till kajen','Vägen går hela vägen fram till fartyget.')}
function returnByBoat(){if(interior||sailing||region===MAIN)return;pendingRoom=null;returnPending=true;const port=navigationPoint(region,region.harbor);if(Math.hypot(player.x-port.x,player.y-port.y)<55){returnPending=false;sailing={to:'main',at:performance.now(),returning:true};path=[];setMessage('Ombord','Fartyget lämnar hamnen och seglar tillbaka mot kajen.');return}if(go(region.harbor,'Till hamnen'))setMessage('Till hamnen','Du går tillbaka till båten innan hemresan börjar.')}
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);layout={w:r.width,h:r.height,d,scale:Math.min(1.08,Math.max(.62,Math.min(r.width/620,r.height/620)))};clamp()}
function clamp(){const hw=layout.w/(2*layout.scale),hh=layout.h/(2*layout.scale);camera.x=Math.max(hw,Math.min(region.w-hw,camera.x));camera.y=Math.max(hh,Math.min(region.h-hh,camera.y))}
function screen(e){const r=canvas.getBoundingClientRect();return{x:camera.x+(e.clientX-r.left-r.width/2)/layout.scale,y:camera.y+(e.clientY-r.top-r.height/2)/layout.scale}}
function draw(){if(interior)return;const{w,h,d,scale}=layout;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);ctx.translate(w/2-camera.x*scale,h/2-camera.y*scale);ctx.scale(scale,scale);ctx.drawImage(layer(region),0,0);window.UPPDRAG_WORLD_LIFE?.draw(ctx,{region,now:performance.now(),activePersonId:window.UPPDRAG_LIVING_DIALOGUES?.personId||pendingPerson?.id,hoverId:hoverPersonId});if(window.UPPDRAG_MEETINGS){UPPDRAG_MEETINGS.drawMapPlayer(ctx,player,window.UPPDRAG_WORLD_KEYBOARD?.motionPath||path,performance.now());}else{ctx.fillStyle='#476d75';ctx.beginPath();ctx.arc(player.x,player.y+8,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e0c09b';ctx.beginPath();ctx.arc(player.x,player.y-9,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4e5c7';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,22,0,Math.PI*2);ctx.stroke();}if(sailing){ctx.fillStyle='#213d4b99';ctx.fillRect(camera.x-w/(2*scale),camera.y-h/(2*scale),w/scale,h/scale);ctx.fillStyle='#f2e5c7';ctx.font='bold 42px Georgia';ctx.textAlign='center';ctx.fillText(sailing.to==='main'?'Tillbaka mot kajen':sailing.to==='marstrand'?'Mot Marstrand':'Över Atlanten',camera.x,camera.y)}status.textContent=region.name}
canvas.addEventListener('pointerdown',e=>{if(interior||sailing||(window.UPPDRAG_LIVING_DIALOGUES?.busy||window.UPPDRAG_STORY_WORK?.busy))return;canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y,moved:false}});canvas.addEventListener('pointermove',e=>{if(!drag){hoverPersonId=window.UPPDRAG_WORLD_LIFE?.hit(region,screen(e))?.id||null;canvas.style.cursor=hoverPersonId?'pointer':'default';return;}const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;if(drag.moved){follow=false;camera.x=drag.cx-dx/layout.scale;camera.y=drag.cy-dy/layout.scale;clamp()}});canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(moved||interior||sailing||(window.UPPDRAG_LIVING_DIALOGUES?.busy||window.UPPDRAG_STORY_WORK?.busy))return;cancelPersonArrival();pending=null;returnPending=false;pendingRoom=null;const p=screen(e),person=window.UPPDRAG_WORLD_LIFE?.hit(region,p);if(person){requestPerson(person);return;}if(harbourMapHit(p)){requestHarbour();return;}const b=region.buildings.find(b=>inRect(p.x,p.y,b,15));if(b){if(roomKind(b))requestInterior(b);else go(b.entry,b.name);return}const n=nearestNode(region,p.x,p.y);go(n.id)});canvas.addEventListener('wheel',e=>{e.preventDefault();if((window.UPPDRAG_LIVING_DIALOGUES?.busy||window.UPPDRAG_STORY_WORK?.busy))return;follow=false;camera.x+=e.deltaX/layout.scale;camera.y+=e.deltaY/layout.scale;clamp()},{passive:false});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{pending=null;returnPending=false;return go(b.dataset.go,b.textContent);});document.querySelector('#visitHarbour').onclick=()=>requestHarbour();document.querySelector('#sailM').onclick=()=>requestHarbour('marstrand');document.querySelector('#sailS').onclick=()=>requestHarbour('colony');document.querySelector('#return').onclick=()=>requestHarbour('main');document.querySelector('#follow').onclick=()=>{follow=true};
function animate(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;const activeRoom=interior?.outdoor?(interior.regionId==='main'?'quay':null):interior?.kind||null;window.UPPDRAG_WORLD_LIFE?.tick(now,{region,player,activeRoom});window.UPPDRAG_LIVING_DIALOGUES?.tick(now);window.UPPDRAG_MEETINGS?.tick(now);window.UPPDRAG_WORLD_KEYBOARD?.tick(dt);window.UPPDRAG_STORY_WORLD?.tick(now);window.UPPDRAG_CH1_PILOT?.tick();if(interior){tickHarbourVoyage(now);requestAnimationFrame(animate);return}if(sailing&&now-sailing.at>1300){const trip=sailing;switchRegion(trip.to,trip.to==='main'?'quay':null)}if(path.length&&!sailing&&!window.UPPDRAG_STORY_WORK?.busy){const n=path[0],dx=n.x-player.x,dy=n.y-player.y,d=Math.hypot(dx,dy),step=180*dt;if(d<=step){player.x=n.x;player.y=n.y;path.shift()}else{player.x+=dx/d*step;player.y+=dy/d*step}if(!path.length&&pending&&region===MAIN&&Math.hypot(player.x-navigationPoint(MAIN,'quay').x,player.y-navigationPoint(MAIN,'quay').y)<60){const to=pending;pending=null;sailing={to,at:now}}if(!path.length&&returnPending&&region!==MAIN){const port=navigationPoint(region,region.harbor);if(Math.hypot(player.x-port.x,player.y-port.y)<60){returnPending=false;sailing={to:'main',at:now,returning:true};setMessage('Ombord','Fartyget lämnar hamnen och seglar tillbaka mot kajen.')}}}finishDoorArrival();finishPersonArrival();if(follow&&!drag&&!interior){camera.x+=(player.x-camera.x)*.12;camera.y+=(player.y-camera.y)*.12;clamp()}draw();requestAnimationFrame(animate)}
// A selected passerby waits at the clicked road position while the player
// approaches. Both remain on that road, about one figure's width apart.
function requestPerson(person){
  if(interior||sailing||voyage||!person||person.region!==region.id||(window.UPPDRAG_LIVING_DIALOGUES?.busy||window.UPPDRAG_STORY_WORK?.busy))return false;
  if(window.UPPDRAG_LIVING_DIALOGUES?.personId===person.id){window.UPPDRAG_LIVING_DIALOGUES.close();return true;}
  window.UPPDRAG_LIVING_DIALOGUES?.close(false);
  cancelPersonArrival();
  const stopped=window.UPPDRAG_WORLD_LIFE?.freeze(person.id);
  if(!stopped?.routeEdge)return false;
  pending=null;returnPending=false;pendingRoom=null;
  if(Math.hypot(player.x-stopped.x,player.y-stopped.y)<=80&&(!window.UPPDRAG_WORLD_KEYBOARD||UPPDRAG_WORLD_KEYBOARD.clearSegment(region,player,stopped))){
    path=[];follow=true;
    if(window.UPPDRAG_LIVING_DIALOGUES?.openWorld(stopped))return true;
    window.UPPDRAG_WORLD_LIFE.release(person.id);return false;
  }
  const edge=stopped.routeEdge,a=navigationPoint(region,edge.a),b=navigationPoint(region,edge.b),length=Math.hypot(b.x-a.x,b.y-a.y);
  const from=roadProjection(player,edge),side=from.t<=stopped.routeT?-1:1;
  const t=Math.max(.025,Math.min(.975,roadProjection(stopped,edge).t+side*54/length));
  const goal={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
  const next=routeAlongRoads(goal,edge);
  if(!next){window.UPPDRAG_WORLD_LIFE.release(person.id);return false;}
  path=next;follow=true;pendingPerson={...stopped,regionId:region.id};
  document.body.dataset.livingApproach=person.id;
  finishPersonArrival();return true;
}
function finishPersonArrival(){
  if(!pendingPerson||path.length||interior||sailing||window.UPPDRAG_STORY_WORK?.busy)return;
  const person=pendingPerson;
  if(person.regionId!==region.id){cancelPersonArrival();return;}
  if(Math.hypot(player.x-person.x,player.y-person.y)>80){cancelPersonArrival();return;}
  pendingPerson=null;
  delete document.body.dataset.livingApproach;
  if(!window.UPPDRAG_LIVING_DIALOGUES?.openWorld(person))window.UPPDRAG_WORLD_LIFE?.release(person.id);
}
canvas.addEventListener('pointercancel',()=>{drag=null;});
canvas.addEventListener('pointerleave',()=>{hoverPersonId=null;canvas.style.cursor='default';});
window.addEventListener('resize',resize);resize();draw();syncHarbourUI();document.documentElement.dataset.ready='true';requestAnimationFrame(animate);
window.UPPDRAG_PAPER.ready.then(ok=>{layers.clear();draw();document.documentElement.dataset.paper=ok?'original':'fallback';if(!ok)console.warn('Originalmaterialet saknas. Grundgrafiken visas.');});
