<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uppdrag 1700 · Demo 3.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6cdbb}
iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .12s}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:16px Georgia,serif;color:#4b4032;background:#eee2c9}
</style>
</head>
<body>
<div id="loading">Laddar Demo 3.2 …</div>
<iframe id="game" src="game.html?v=3.2-return" title="Uppdrag 1700 Demo 3.2"></iframe>
<script>
'use strict';
const frame=document.querySelector('#game'),loading=document.querySelector('#loading');
frame.addEventListener('load',()=>{
 const w=frame.contentWindow;
 // Correct the polygon test before restarting the world renderer.
 w.pointInPoly=function(x,y,p){let hit=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])hit=!hit}return hit};
 try{w.requestAnimationFrame(w.animate)}catch{}
 loading.hidden=true;frame.style.opacity='1';
});
</script>
</body>
</html>
