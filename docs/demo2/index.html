<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uppdrag 1700 – Demo 2.0</title>
<style>
:root{font-family:Georgia,serif;color:#3b3328;background:#e9ddc2}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 15px;background:#eee2c8;border-bottom:2px solid #b5a17d}
h1{font-size:clamp(18px,4vw,26px);font-weight:normal;margin:0}header span{font:12px system-ui,sans-serif}
main{position:relative;flex:1;min-height:0;overflow:hidden;background:#d1c8b5;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}
#info{position:absolute;left:12px;bottom:12px;background:#f3e7ceef;border:1px solid #ac9570;padding:10px 13px;border-radius:5px;max-width:min(320px,75vw);pointer-events:none;font:14px/1.4 system-ui,sans-serif}
#hud{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px;background:#eee2c8;border-top:2px solid #b5a17d}
button{font:14px system-ui,sans-serif;min-height:43px;padding:8px 13px;background:#d5bd8e;border:1px solid #a88e62;border-radius:5px;color:#352c20}
#status{font:12px/1.4 system-ui,sans-serif}#help{font-size:12px}
@media(max-width:640px){header{padding:6px 10px}h1{font-size:17px}header span{display:none}#hud{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px}#status{grid-column:1/-1;grid-row:1;text-align:center}#hud button{font-size:12px;min-height:38px;padding:7px 6px}#info{left:8px;bottom:8px;max-width:calc(100% - 16px);font-size:12px;padding:8px 10px}#zoom{display:none}#home{display:none}}
</style></head><body>
<header><h1>UPPDRAG 1700 <small>· DEMO 2.0</small></h1><span>Världen · utan uppdrag</span></header>
<main id="stage"><canvas id="world" aria-label="Utforskbar värld, dra för att panorera och tryck på en byggnad för att undersöka den"></canvas><div id="info">Dra kartan för att se hur staden fortsätter. Tryck på marken för att gå, eller på en byggnad för att besöka den.</div></main>
<div id="hud"><button id="home">Till gamla staden</button><span id="status">Gamla staden</span><button id="zoom">Visa mer</button><button id="sailMarstrand">Segla till Marstrand</button><button id="sailColony">Segla till Saint Barthélemy</button><button id="returnHarbor" hidden>Åter till kajen</button></div>
<script>
'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),info=document.querySelector('#info'),status=document.querySelector('#status');
const W=4200,H=1700,old={x:1450,y:470,w:1280,h:720};
const original=new Image();original.src='../world/assets/town.webp';
let camera={x:old.x+640,y:old.y+360},scale=0.68,drag=null,moved=false,ready=false,walkingTo=null,region='main',sailing=null,pendingSail=null,followPlayer=true;const player={x:old.x+610,y:old.y+405};
const locations=[
 {name:'Kaffehuset',x:2150,y:730,area:'Gamla staden'},
 {name:'Tryckeriet',x:1810,y:850,area:'Gamla staden'},
 {name:'Kajen',x:2490,y:890,area:'Gamla staden'},
 {name:'Arkivet',x:1930,y:1025,area:'Gamla staden'},
 {name:'Barnhuset',x:3130,y:710,area:'Barnhuskvarteren'},
 {name:'Verkstäderna',x:3370,y:970,area:'Barnhuskvarteren'},
 {name:'Vetenskapens hus',x:960,y:690,area:'Vetenskapens kvarter'},
 {name:'Slottet',x:980,y:400,area:'Slottshöjden'},
 {name:'Operan',x:1200,y:1020,area:'Slottshöjden'},
 {name:'Byn',x:3650,y:350,area:'Landsbygden'},
 {name:'Kvarnen',x:3890,y:670,area:'Landsbygden'}
];
// Reuse one deterministic paper grain for the whole world.
const grain=document.createElement('canvas');grain.width=grain.height=128;
const gx=grain.getContext('2d');let seed=1700;
for(let i=0;i<1500;i++){seed=(1664525*seed+1013904223)>>>0;const x=seed%128;seed=(1664525*seed+1013904223)>>>0;const y=seed%128;gx.fillStyle=i%3?'#fff5dc':'#4a3a2d';gx.globalAlpha=i%3?.13:.09;gx.fillRect(x,y,1+i%2,1+i%2)}
const paperGrain=ctx.createPattern(grain,'repeat');
function poly(points,color){ctx.save();ctx.shadowColor='#473e2d35';ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;ctx.shadowBlur=1;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.shadowColor='transparent';ctx.clip();ctx.globalAlpha=.22;ctx.fillStyle=paperGrain;const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);const left=Math.min(...xs),top=Math.min(...ys);ctx.fillRect(left,top,Math.max(...xs)-left,Math.max(...ys)-top);ctx.restore()}
function rect(x,y,w,h,color){ctx.save();ctx.shadowColor='#473e2d22';ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.shadowColor='transparent';ctx.globalAlpha=.24;ctx.fillStyle=paperGrain;ctx.fillRect(x,y,w,h);ctx.restore()}
function road(points,width=110){ctx.lineJoin='round';ctx.lineCap='round';for(const [w,c] of [[width+12,'#b5a993'],[width,'#f2e4cc']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}}
function building(x,y,w,h,roof='#655e54'){rect(x+9,y+13,w,h,'#96816b');rect(x,y,w,h,'#d3c6af');poly([[x-9,y+3],[x+w*.54,y-12],[x+w+7,y],[x+w+7,y+h],[x,y+h+5]],roof);ctx.strokeStyle='#f0dfc1';ctx.lineWidth=4;ctx.strokeRect(x+2,y+2,w-4,h-4)}
function tree(x,y,r=24){rect(x-5,y+7,10,r,'#776b53');poly([[x,y-r],[x+r,y+7],[x-r,y+7]],'#73836a');poly([[x,y-r-12],[x+r*.72,y-2],[x-r*.72,y-2]],'#8a9878')}
function label(t,x,y){ctx.font='bold 25px Georgia';const width=ctx.measureText(t).width+35;rect(x-width/2,y-33,width,41,'#f1e3c7');ctx.strokeStyle='#b6a17f';ctx.lineWidth=2;ctx.strokeRect(x-width/2,y-33,width,41);ctx.fillStyle='#4c4030';ctx.textAlign='center';ctx.fillText(t,x,y-5)}
function backdrop(){
 // The original town image remains unaltered. Surrounding land is constructed in
 // the same flat overhead paper-cut language, with roads that join its boundaries.
 rect(0,0,W,H,'#cfc6b4');
 // Land patches, not separate map cards.
 poly([[0,0],[1400,0],[1430,465],[1350,650],[1240,1120],[930,1430],[0,1390]],'#b9bea5');
 poly([[2730,0],[4200,0],[4200,1440],[3490,1460],[3090,1370],[2740,1210]],'#c8c2a8');
 poly([[0,1400],[600,1440],[1080,1390],[1450,1480],[2460,1500],[3130,1480],[4200,1450],[4200,1700],[0,1700]],'#4d7489');
 // Agricultural fields on the eastern ridge.
 for(let i=0;i<9;i++){
  const x=3460+(i%5)*144,y=80+Math.floor(i/5)*155;
  poly([[x,y],[x+124,y+8],[x+114,y+135],[x-4,y+126]],i%2?'#aab18b':'#d0bd91');
  for(let j=0;j<4;j++)road([[x+18,y+23+j*27],[x+105,y+28+j*27]],2);
 }
 // Western palace grounds and scholarly gardens.
 poly([[360,160],[1230,155],[1370,660],[1120,980],[330,1030]],'#b1b9a0');
 for(let i=0;i<6;i++)rect(450+i*124,190,70,210,i%2?'#a7b08c':'#c1bd9b');
 // Streets form a connected network. The old town retains its original streets.
 road([[0,840],[380,825],[820,810],[1200,835],[1450,835]],78);
 road([[2730,835],[2820,835],[3020,825],[3320,845],[3700,825],[4200,825]],84);
 road([[2900,825],[2910,580],[3130,420],[3450,360],[3890,350]],58);
 road([[3200,845],[3200,1110],[3480,1160],[3800,1120]],58);
 road([[3650,825],[3760,590],[3970,510]],52);
 road([[1000,830],[1020,560],[980,410],[1070,230]],60);
 road([[1210,830],[1180,1120],[1400,1220]],50);
 // A narrow stream is the only local water crossing; the quay remains on the coast.
 poly([[2820,0],[2860,0],[2870,210],[2840,410],[2860,610],[2880,740],[2880,940],[2870,1150],[2830,1300],[2800,1450],[2735,1450],[2780,1230],[2810,1000],[2800,780],[2780,610],[2790,400],[2810,220]],'#7895a0');
 // Bridge across the stream at the main street.
 rect(2750,778,165,116,'#9b866b');
 for(let i=0;i<7;i++)rect(2762+i*21,785,11,104,'#ddca9f');
 rect(2750,771,165,9,'#76694f');rect(2750,896,165,9,'#76694f');
 // Secondary footbridge north of the city.
 rect(2785,380,100,38,'#a08b6c');
 for(let i=0;i<5;i++)rect(2790+i*19,383,10,32,'#ddcba8');
 // Tree-lined palace gardens and city edge.
 for(let i=0;i<18;i++){tree(160+(i*137)%1190,140+(i*211)%1130,18+i%4*5)}
 for(let i=0;i<19;i++){const x=2920+(i*97)%1180,y=110+(i*233)%1230;
  if((x>2990&&x<3360&&y>470&&y<810)||(x>3270&&x<3740&&y>850&&y<1120))continue;tree(x,y,17+i%4*4)}
 // Palace, scientific rooms and opera to the west of the original.
 building(760,250,300,170,'#6a6157');
 building(920,510,220,125,'#8d6959');
 building(1120,990,215,140,'#665e54');
 rect(870,320,35,68,'#f1e4c9');rect(935,320,35,68,'#f1e4c9');
 for(let i=0;i<4;i++)rect(560+i*82,500,50,115,'#c4b598');
 // Barnhuskvarteren, streets, workshops and yards.
 const eastHouses=[
 [2940,490,300,180,'#995b4b'],[3270,470,180,125,'#8a6654'],
 [3520,510,205,135,'#6c655c'],[2990,1000,195,140,'#7c6255'],
 [3330,935,320,175,'#5b5953'],[3770,900,235,145,'#8b6353'],
 [3670,560,235,165,'#7b6857'],[3160,200,170,115,'#a66c53'],
 [3060,1160,145,100,'#965f4d'],[3480,1220,165,100,'#a06550']
 ];
 eastHouses.forEach(([x,y,w,h,c])=>building(x,y,w,h,c));
 // Courtyard, vegetable patch, washing lines and craft material.
 rect(3040,735,175,58,'#b9aa8b');
 for(let i=0;i<5;i++)rect(3060+i*32,750,16,28,'#7b956d');
 rect(3370,1120,16,105,'#77634b');rect(3590,1120,16,105,'#77634b');
 for(let i=0;i<5;i++)rect(3410+i*35,1125,22,10,'#eee1c8');
 for(let i=0;i<5;i++)rect(3400+i*55,1000,15,90,'#8b7355');
 // Countryside buildings and a simple mill on the right.
 building(3690,220,215,140,'#88694e');
 rect(3920,530,22,150,'#7a6650');
 poly([[3931,520],[3890,590],[3931,565],[3970,590]],'#eee1c8');
 poly([[3931,565],[3885,520],[3915,580],[3885,620]],'#d6c7a5');
 // Harbor and pier stay at the southern waterfront, not between quarters.
 rect(2440,1170,52,295,'#80694e');rect(2360,1390,235,40,'#8e7453');
 for(const x of [2390,2480,2570])rect(x,1420,15,57,'#5f5545');
 poly([[2610,1510],[2870,1510],[2820,1565],[2650,1565]],'#705b47');
 rect(2720,1290,12,220,'#75664e');
 poly([[2735,1310],[2820,1485],[2735,1485]],'#f1e4c9');
 poly([[2705,1350],[2630,1485],[2705,1485]],'#d6c8a9');
 // Overlay the ORIGINAL map only in its unchanged geographic bounds.
 if(original.complete&&original.naturalWidth)ctx.drawImage(original,old.x,old.y,old.w,old.h);
 // The seam is a road/bridge, not an expanse of sea.
 road([[2710,835],[2760,835],[2820,835]],55);
 label('Vetenskapens kvarter',960,760);
 label('Slottet',970,375);
 label('Operan',1210,1140);
 label('Barnhuskvarteren',3090,550);
 label('Verkstäderna',3470,920);
 label('Landsbygden',3750,300);
}
const seaSites={
 marstrand:[{name:'Fästningen',x:1180,y:460},{name:'Hamnen',x:820,y:920},{name:'Stadens hus',x:1590,y:760}],
 colony:[{name:'Gustavia',x:1180,y:560},{name:'Hamnen',x:740,y:1010},{name:'Handelsplatsen',x:1650,y:850}]
};
function islandScene(which){
 const tropical=which==='colony';
 rect(0,0,W,H,tropical?'#527f8e':'#53758a');
 // A separate geographic destination, not another room in the Swedish town.
 poly(tropical?[[480,300],[810,175],[1600,160],[2090,410],[2290,900],[2010,1260],[1250,1360],[650,1160],[360,740]]:[[390,470],[800,240],[1430,280],[1900,590],[1940,1020],[1540,1300],[870,1210],[410,890]],tropical?'#d8c49b':'#b6b5a0');
 poly(tropical?[[680,390],[1250,270],[1850,480],[1980,840],[1650,1100],[900,1100],[580,800]]:[[590,520],[880,350],[1390,400],[1760,660],[1650,1040],[1030,1100],[540,830]],tropical?'#9daa80':'#899c80');
 road([[750,1040],[900,910],[1180,760],[1560,760],[1850,880]],80);
 road([[1170,760],[1180,530],[1370,390]],60);
 for(const [x,y,w,h,c] of tropical?[[970,490,230,145,'#a95b47'],[1490,730,250,145,'#ab6652'],[1300,360,190,110,'#a45c49']]:[[1020,390,270,160,'#685b54'],[1410,700,260,150,'#8c6557'],[720,790,240,150,'#945f50']])building(x,y,w,h,c);
 if(!tropical){rect(1000,290,340,90,'#777366');rect(1040,190,55,100,'#777366');rect(1240,200,55,90,'#777366')}
 for(let i=0;i<18;i++){const x=610+(i*91)%1290,y=340+(i*137)%700;if(tropical){rect(x-4,y,8,38,'#766f50');poly([[x,y-45],[x-45,y-12],[x,y-22],[x+42,y-10]],'#778e63')}else tree(x,y,15+(i%3)*5)}
 // Pier, boat and sea route visually identify the harbor.
 rect(610,1080,260,35,'#77634c');rect(670,1115,18,110,'#665640');rect(810,1115,18,110,'#665640');
 poly([[340,1200],[650,1200],[580,1270],[415,1270]],'#665b4a');
 rect(500,1020,9,175,'#715e47');poly([[510,1030],[615,1160],[510,1160]],'#eee1c6');
 label(tropical?'GUSTAVIA · SAINT BARTHÉLEMY':'MARSTRAND',1230,170);
 for(const site of seaSites[which])label(site.name,site.x,site.y-45);
}
function sail(destination){
 if(region!=='main')return;
 const quay={x:old.x+1040,y:old.y+420};if(Math.hypot(player.x-quay.x,player.y-quay.y)>95){walkingTo=quay;pendingSail=destination;info.textContent='Först går du till kajen för att gå ombord.';return}
 walkingTo=null;sailing={destination,started:performance.now()};
 info.textContent=destination==='marstrand'?'Du går ombord på båten mot Marstrand.':'Du går ombord på ett fartyg för den långa Atlantresan.';
}
function returnToHarbor(){
 region='main';sailing=null;walkingTo=null;player.x=old.x+1040;player.y=old.y+420;
 camera={x:player.x,y:player.y};followPlayer=true;clamp();updateRegion();draw();
}
function updateRegion(){
 document.querySelector('#returnHarbor').hidden=region==='main';
 document.querySelector('#sailMarstrand').hidden=region!=='main';
 document.querySelector('#sailColony').hidden=region!=='main';
 document.querySelector('#home').hidden=region!=='main';
 document.querySelector('#zoom').hidden=region!=='main';
 status.textContent=region==='main'?'Huvudstaden':region==='marstrand'?'Marstrand':'Saint Barthélemy';
}

function avatar(){const x=player.x,y=player.y;ctx.fillStyle='#486c72';ctx.beginPath();ctx.arc(x,y-12,13,0,Math.PI*2);ctx.fill();poly([[x-14,y],[x+14,y],[x+10,y+29],[x-10,y+29]],'#486c72')}
function draw(){
 const width=stage.clientWidth,height=stage.clientHeight;scale=Math.min(1.05,Math.max(.58,Math.min(width/630,height/650)));if(followPlayer&&!drag&&!sailing){camera.x+=(player.x-camera.x)*.14;camera.y+=(player.y-camera.y)*.14;clamp()}
 const d=Math.min(devicePixelRatio||1,2),r=stage.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));
 ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);
 ctx.translate(r.width/2-camera.x*scale,r.height/2-camera.y*scale);ctx.scale(scale,scale);
 if(region==='main')backdrop();else islandScene(region);avatar();if(sailing){rect(camera.x-1100,camera.y-700,2200,1400,'#203c4b88');ctx.fillStyle='#f3e6c9';ctx.font='bold 50px Georgia';ctx.textAlign='center';ctx.fillText(sailing.destination==='marstrand'?'Mot Marstrand':'Över Atlanten',camera.x,camera.y)}
}
function worldPoint(e){const r=canvas.getBoundingClientRect();return{x:camera.x+(e.clientX-r.left-r.width/2)/scale,y:camera.y+(e.clientY-r.top-r.height/2)/scale}}
function clamp(){const r=stage.getBoundingClientRect();camera.x=Math.max(r.width/(2*scale),Math.min(W-r.width/(2*scale),camera.x));camera.y=Math.max(r.height/(2*scale),Math.min(H-r.height/(2*scale),camera.y))}
function focus(){if(region!=='main')return;camera={x:player.x,y:player.y};clamp();draw()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y};moved=false});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>9)moved=true;camera.x=drag.cx-dx/scale;camera.y=drag.cy-dy/scale;followPlayer=false;clamp();draw()});
canvas.addEventListener('pointerup',e=>{if(!moved){const p=worldPoint(e),near=(region==='main'?locations:seaSites[region]).find(l=>Math.hypot(l.x-p.x,l.y-p.y)<125);if(near){info.textContent=near.name+' · '+near.area+' (miljön finns, uppdragen kommer senare)';if(near.area)status.textContent=near.area;walkingTo={x:near.x,y:near.y};followPlayer=true}else{walkingTo={x:p.x,y:p.y};followPlayer=true;info.textContent='Du går vidare genom den utbyggda världen.'}}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.x+=e.deltaX/scale;camera.y+=e.deltaY/scale;followPlayer=false;clamp();draw()},{passive:false});
document.querySelector('#sailMarstrand').onclick=()=>sail('marstrand');document.querySelector('#sailColony').onclick=()=>sail('colony');document.querySelector('#returnHarbor').onclick=returnToHarbor;
document.querySelector('#home').onclick=()=>{followPlayer=true;focus()};document.querySelector('#zoom').onclick=()=>{followPlayer=!followPlayer;if(followPlayer)focus();else{camera.x=old.x+640;camera.y=old.y+360;clamp();draw()}};
window.addEventListener('resize',()=>{clamp();draw()});
let lastPaint=0;function animate(now){if(sailing&&performance.now()-sailing.started>1500){region=sailing.destination;sailing=null;walkingTo=null;player.x=760;player.y=1020;camera={x:player.x,y:player.y};followPlayer=true;clamp();updateRegion();info.textContent=region==='marstrand'?'Du har anlänt till Marstrand. Utforska hamnen och fästningen.':'Du har anlänt till Gustavia på Saint Barthélemy. Utforska hamnen och handelsplatsen.';draw()}if(walkingTo){const dx=walkingTo.x-player.x,dy=walkingTo.y-player.y,d=Math.hypot(dx,dy);if(d<4){walkingTo=null;if(pendingSail){const destination=pendingSail;pendingSail=null;sail(destination)}}else{const speed=Math.min(d,4);player.x+=dx/d*speed;player.y+=dy/d*speed}draw()}else if(followPlayer&&now-lastPaint>45){draw();lastPaint=now}requestAnimationFrame(animate)}
original.onload=draw;original.onerror=()=>{info.textContent='Originalbilden kunde inte laddas. De nya kvarteren kan ändå utforskas.';draw()};
focus();updateRegion();requestAnimationFrame(animate);
</script></body></html>
