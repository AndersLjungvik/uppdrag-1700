document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{if(region!==MAIN)switchRegion('main');const key=b.dataset.focus,goal=MAIN.starts[key];goTo(goal,key==='old'?'Gamla staden':key==='barn'?'Barnhuskvarteren':key==='science'?'Vetenskapens kvarter':'Landsbygden')});
document.querySelector('#sailM').onclick=()=>requestSail('marstrand');document.querySelector('#sailS').onclick=()=>requestSail('colony');document.querySelector('#return').onclick=()=>switchRegion('main');document.querySelector('#follow').onclick=()=>{follow=true};
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(sailing&&now-sailing.at>1400)switchRegion(sailing.to);if(route.length&&!sailing){const next=route[0],dx=next.x-player.x,dy=next.y-player.y,d=Math.hypot(dx,dy),step=175*dt;if(d<=step){player.x=next.x;player.y=next.y;route.shift()}else{const nx=player.x+dx/d*step,ny=player.y+dy/d*step;if(walkable(region,nx,ny)){player.x=nx;player.y=ny}else{route=[];setMessage('Stopp','Rörelsen stoppades av terrängen.')}}if(!route.length&&pendingDestination&&region===MAIN&&Math.hypot(player.x-MAIN.harborStart.x,player.y-MAIN.harborStart.y)<80){const to=pendingDestination;pendingDestination=null;sailing={to,at:now}}}if(follow&&!dragging){camera.x+=(player.x-camera.x)*.12;camera.y+=(player.y-camera.y)*.12;clampCamera()}draw();requestAnimationFrame(animate)}
window.addEventListener('resize',resize);resize();requestAnimationFrame(animate);
</script>
